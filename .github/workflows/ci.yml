name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit -p .

      - name: Run unit tests
        run: bun test tests/unit

      - name: Run integration tests
        run: bun test tests/integration

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun test tests/e2e

  binary:
    name: Compiled binary smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary with embedded client bundles
        run: bun run build:binary

      # Run outside the checkout so nothing can fall back to source files
      - name: Build fixture docs with the binary
        run: |
          cp -r tests/fixtures/sample-docs "$RUNNER_TEMP/docs"
          cp opendoc "$RUNNER_TEMP/opendoc"
          cd "$RUNNER_TEMP"
          ./opendoc build docs
          test -f docs/dist/index.html
          test -f docs/dist/_opendoc/viewer.js
          test -f docs/dist/_opendoc/editor.js
          test -f docs/dist/_opendoc/search-index.json
